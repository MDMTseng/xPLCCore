[pytest]
# Restrict collection to tests/ -- the codesys_scripts root has loose
# ad-hoc TCP scripts named test_*.py (e.g. test_get_diag.py,
# test_a5_protocol_version.py) that connect to 192.168.1.70:8125 at
# import time. They aren't pytest-style and they error on collection
# whenever the UI is holding the PLC's single-client TCP socket.
# Real regression tests live in tests/ and route through the harness.
testpaths = tests
python_files = test_*.py
