; EasyCAT PRO (LAN9252) + ESP32 -- EtherCAT slave test firmware
;
; Wiring (EasyCAT PRO revB -> ESP32 DevKit):
;   3.3 -> 3V3 (never 5V/VIN)   G   -> GND
;   MI  -> GPIO19 (VSPI MISO)   MO  -> GPIO23 (VSPI MOSI)
;   SCK -> GPIO18 (VSPI SCK)    SCS -> GPIO5  (chip select)
;   INT -> GPIO17               SYN0 -> GPIO16   SYN1 -> GPIO4
; DC_SYNC: SYNC0 reaches the ESP32 as the LAN9252 interrupt on INT
; (GPIO17). SYN0/SYN1 pins are wired but not read.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
