<title>PackerX 虛擬產線時序</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F4F2; --panel:#FFFFFF; --ink:#17201C; --muted:#5B6964; --grid:#DCE3DF; --grid2:#EBF0ED;
  --arm:#3D6E8F; --arm2:#7FA3BC; --suck:#178A73; --blow:#0E5A4B; --feed:#8C6B34; --brake:#B9975C;
  --flight:#E4CF8E; --cam:#6A4C9C; --light:#C3B2E3; --reel:#C07A12; --mark:#17201C;
  --ok:#2E8B57; --ng:#C4392F; --band:rgba(61,110,143,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111715; --panel:#18201D; --ink:#E4EBE7; --muted:#92A29C; --grid:#2A3531; --grid2:#1F2825;
    --arm:#6FA3C6; --arm2:#3E6A87; --suck:#3FBF9F; --blow:#8FE3CC; --feed:#C9A45E; --brake:#7E6536;
    --flight:#6E5F33; --cam:#A58BD6; --light:#56477A; --reel:#E3A54A; --mark:#E4EBE7;
    --ok:#4CC38A; --ng:#F06A5E; --band:rgba(111,163,198,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111715; --panel:#18201D; --ink:#E4EBE7; --muted:#92A29C; --grid:#2A3531; --grid2:#1F2825;
  --arm:#6FA3C6; --arm2:#3E6A87; --suck:#3FBF9F; --blow:#8FE3CC; --feed:#C9A45E; --brake:#7E6536;
  --flight:#6E5F33; --cam:#A58BD6; --light:#56477A; --reel:#E3A54A; --mark:#E4EBE7;
  --ok:#4CC38A; --ng:#F06A5E; --band:rgba(111,163,198,.07);
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.2vw,40px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
.lede{color:var(--muted);max-width:68ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--grid);border:1px solid var(--grid);border-radius:6px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400}
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.finding{border-left:3px solid var(--grid);padding:2px 0 2px 12px}
.finding h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 2px;letter-spacing:.01em}
.finding p{margin:0;color:var(--muted)}
.finding.good{border-left-color:var(--ok)} .finding.warn{border-left-color:var(--reel)} .finding.note{border-left-color:var(--arm)}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.chart{background:var(--panel);border:1px solid var(--grid);border-radius:6px;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px;border-bottom:1px solid var(--grid)}
.toolbar .group{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--grid);border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--arm);outline-offset:2px}
input[type=range]{width:140px;accent-color:var(--arm)}
.zoomval{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:7ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:10px;border-radius:2px;display:inline-block}
.gantt{display:grid;grid-template-columns:auto 1fr}
.labels{border-right:1px solid var(--grid)}
.labels div{height:var(--lane);display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-bottom:1px solid var(--grid2)}
.labels div b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;white-space:nowrap}
.labels div i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.labels .axis{height:28px;border-bottom:1px solid var(--grid)}
.scroller{overflow-x:auto;overflow-y:hidden;cursor:grab}
.scroller.drag{cursor:grabbing}
svg{display:block}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:4px;max-width:280px;z-index:10;font-family:var(--body);line-height:1.4}
.tip b{font-family:var(--mono);font-weight:500}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--grid);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--grid2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--bg)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
tr:hover td{background:var(--grid2)}
tr{cursor:pointer}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;font-weight:600}
.pill.place{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.toss{background:color-mix(in srgb,var(--ng) 14%,transparent);color:var(--ng)}
.slow{color:var(--ng)}
.foot{font-size:12px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>PackerX 虛擬產線時序</h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="stats" id="stats" aria-label="摘要"></section>
  <section class="findings" id="findings"></section>

  <section class="chart" aria-label="甘特圖">
    <div class="toolbar">
      <div class="group">
        <button id="fit" type="button">全覽</button>
        <button id="zout" type="button" aria-label="縮小">−</button>
        <input id="zoom" type="range" min="0" max="100" value="0" aria-label="縮放">
        <button id="zin" type="button" aria-label="放大">＋</button>
        <span class="zoomval" id="zoomval"></span>
      </div>
      <div class="legend">
        <span><i class="sw" style="background:var(--arm)"></i>運動段</span>
        <span><i class="sw" style="border:1px dashed var(--ng)"></i>手臂閒置 &gt;1 s</span>
        <span><i class="sw" style="background:var(--suck)"></i>吸</span>
        <span><i class="sw" style="background:var(--blow)"></i>破真空</span>
        <span><i class="sw" style="background:var(--feed)"></i>振動</span>
        <span><i class="sw" style="background:var(--brake)"></i>剎車</span>
        <span><i class="sw" style="background:var(--flight)"></i>柔震盤燈</span>
        <span><i class="sw" style="background:var(--cam)"></i>相機觸發</span>
        <span><i class="sw" style="background:var(--light)"></i>頂部光源</span>
        <span><i class="sw" style="background:var(--reel)"></i>捲料</span>
        <span>◆ 視覺結果</span>
        <span style="color:var(--ok)">▲ 放料</span>
        <span style="color:var(--ng)">▼ 丟料</span>
      </div>
    </div>
    <div class="gantt">
      <div class="labels" id="labels"></div>
      <div class="scroller" id="scroller"><svg id="svg" role="img" aria-label="各機構動作的時間軸"></svg></div>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <h2>逐顆明細</h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>#</th><th class="num">時間 (s)</th><th>結果</th><th>原因</th>
          <th class="num">距上一顆 (ms)</th><th class="num">捲料開始</th><th class="num">頂部第 2 拍</th><th class="num">頂部結果</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="foot">捲料開始、頂部第 2 拍、頂部結果都是從放料後破真空起算（ms）；空白代表那一次沒有前進載帶。點一列可以把甘特圖捲到那個時間點。時間來自 PLC 的 1 ms 事件記錄（PRG_EventLog），視覺結果是虛擬模擬器的回覆，所以「頂部結果」包含模擬器固定約 250 ms 的延遲。</p>
  </section>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const D = /*__DATA__*/null;
const S = D.summary;
const fmtS = ms => (ms/1000).toFixed(1);
const $ = id => document.getElementById(id);

$("eyebrow").textContent = `全虛擬場景 · ${S.events} 筆 PLC 事件 · 1 ms 解析度`;
$("lede").textContent = `隨機注入側面、底部與載帶 NG，跑到包裝完成。每一條軌道都是 PLC 在 1 ms 任務裡記下的實際動作；視覺結果、振動與柔震盤燈是渲染端打在同一時間軸上的標記。`;

const stats = [
  ["總時長", fmtS(S.span), "s"],
  ["包裝完成", S.packed ?? "—", "顆"],
  ["放料 / 丟料", `${S.places} / ${S.tosses}`, "次"],
  ["放料間隔中位數", S.gap_place != null ? Math.round(S.gap_place) : "—", "ms"],
  ["丟料一輪中位數", S.gap_toss != null ? Math.round(S.gap_toss) : "—", "ms"],
  ["頂部第 2 拍中位數", Math.round(S.shot2), "ms"],
  ["柔震盤補料", S.refills, "次"],
];
$("stats").innerHTML = stats.map(([k,v,u]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v} <small>${u}</small></span></div>`).join("");

const extra = S.packed != null ? S.places - S.packed : null;
const gp = S.gap_place != null ? Math.round(S.gap_place) : null, gt = S.gap_toss != null ? Math.round(S.gap_toss) : null;
const F = [];
F.push([S.topres <= 700 ? "good" : "warn", S.topres <= 700 ? "載帶路徑在目標內" : "載帶路徑超過目標",
  `放料後破真空到頂部第 2 拍中位數 ${Math.round(S.shot2)} ms，到頂部結果 ${Math.round(S.topres)} ms（目標 0.7 s；含不需前進載帶的輪次）。`]);
if (gp != null && gt != null) F.push(gt <= gp
  ? ["good", "NG 不拖慢節拍", `丟料一輪中位數 ${gt} ms，比放料一輪 ${gp} ms 還短：丟料不必放入載帶。NG 只是少包一顆，不會讓下一輪變慢。`]
  : ["warn", "NG 一輪比較慢", `丟料一輪中位數 ${gt} ms，放料一輪 ${gp} ms。`]);
if (S.waits){
  const known = S.wait_why.filter(w => w.startsWith("等待")).map(w => w.replace("等待", "等"));
  const other = S.wait_why.length - known.length;
  F.push(["warn", `手臂閒置 ${S.waits} 次、共 ${fmtS(S.wait_ms)} s`,
    `${known.length ? "主要在" + known.join("、") : "原因沒有標記"}${other ? "，另有閒置期間沒有渲染端標記" : ""}（圖上紅框，滑鼠移上去看原因）。這次是視覺模擬器輪詢 PLC 變慢造成的，不是機台動作；換成真的 VisionMaster 要重新量。`]);
}
if (extra) F.push(["note", "補放同一格", `放料 ${S.places} 次、包裝 ${S.packed} 顆：有 ${extra} 次頂部檢查判定那一格 NG（注入的載帶 NG），不前進載帶、補放同一格。`]);
$("findings").innerHTML = F.map(([c,h,p]) => `<div class="finding ${c}"><h3>${h}</h3><p>${p}</p></div>`).join("");

const LANES = [
  ["arm","手臂","運動段"],["nozzle","吸嘴","吸 / 破真空"],["feeder","柔震盤","振動 · 剎車 · 燈 · 拍照"],
  ["side","側面相機","觸發 · 結果"],["btm","底部相機","觸發 · 結果"],["reel","載帶捲料","ReelGo"],
  ["top","頂部相機","兩光拍照 · 結果"],["result","結果","放料 / 丟料"],
];
const LANE_H = 44, AXIS_H = 28, PAD = 16;
document.documentElement.style.setProperty("--lane", LANE_H + "px");
$("labels").innerHTML = `<div class="axis"></div>` + LANES.map(([,n,s]) => `<div><b>${n}</b><i>${s}</i></div>`).join("");

const svg = $("svg"), scroller = $("scroller"), tip = $("tip");
const NS = "http://www.w3.org/2000/svg";
let pxPerMs = 0.05;
const MIN = () => Math.max(0.005, (scroller.clientWidth - 2*PAD) / S.span);
const MAX = 1.2;
function zoomToSlider(z){ return Math.round(100 * Math.log(z/MIN()) / Math.log(MAX/MIN())); }
function sliderToZoom(v){ return MIN() * Math.pow(MAX/MIN(), v/100); }

const NAMES = {wait:"手臂閒置",move:"運動段",suck:"吸",blow:"破真空",brake:"剎車",shot:"相機觸發",light:"頂部光源",reel:"捲料",vib:"振動",flight:"柔震盤燈",result:"視覺結果",place:"放料",toss:"丟料"};
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

function render(){
  const W = Math.ceil(S.span * pxPerMs) + 2*PAD, H = AXIS_H + LANES.length * LANE_H;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const x = t => PAD + t * pxPerMs;
  // result bands
  const res = D.lanes.result;
  res.forEach((r,i) => { if (i % 2 === 0){ const nx = i+1 < res.length ? res[i+1].s : S.span; el("rect",{x:x(r.s),y:AXIS_H,width:Math.max(0,x(nx)-x(r.s)),height:H-AXIS_H,fill:"var(--band)"},svg);} });
  // lane rules
  LANES.forEach((_,i) => el("line",{x1:0,x2:W,y1:AXIS_H+(i+1)*LANE_H-.5,y2:AXIS_H+(i+1)*LANE_H-.5,stroke:"var(--grid2)"},svg));
  // axis: pick a step that keeps labels >= 70 px apart
  const steps = [100,200,500,1000,2000,5000,10000];
  const step = steps.find(s => s*pxPerMs >= 70) || 10000;
  for (let t = 0; t <= S.span; t += step){
    el("line",{x1:x(t),x2:x(t),y1:AXIS_H-6,y2:H,stroke:"var(--grid)","stroke-width":t % (step*5) === 0 ? 1 : .5},svg);
    const tx = el("text",{x:x(t)+3,y:16},svg); tx.textContent = step < 1000 ? (t/1000).toFixed(1)+" s" : (t/1000)+" s";
  }
  el("line",{x1:0,x2:W,y1:AXIS_H-.5,y2:AXIS_H-.5,stroke:"var(--grid)"},svg);

  LANES.forEach(([key],li) => {
    const top = AXIS_H + li*LANE_H;
    for (const it of D.lanes[key]){
      const x0 = x(it.s), w = Math.max(1.5, (it.e - it.s) * pxPerMs);
      let node;
      if (it.k === "result"){
        const cy = top + LANE_H/2, r = 5;
        node = el("path",{d:`M${x0} ${cy-r} L${x0+r} ${cy} L${x0} ${cy+r} L${x0-r} ${cy} Z`,fill:"var(--mark)"},svg);
      } else if (it.k === "place" || it.k === "toss"){
        const c = it.k === "place" ? "var(--ok)" : "var(--ng)", cy = top + LANE_H/2;
        el("line",{x1:x0,x2:x0,y1:AXIS_H,y2:top+LANE_H,stroke:c,"stroke-width":1,"stroke-dasharray":"2 3",opacity:.55},svg);
        node = it.k === "place"
          ? el("path",{d:`M${x0} ${cy-8} L${x0+7} ${cy+5} L${x0-7} ${cy+5} Z`,fill:c},svg)
          : el("path",{d:`M${x0-7} ${cy-5} L${x0+7} ${cy-5} L${x0} ${cy+8} Z`,fill:c},svg);
      } else {
        let y = top + 7, h = LANE_H - 14, fill = "var(--arm)";
        if (it.k === "wait"){
          node = el("rect",{x:x0+.5,y:y+.5,width:Math.max(1,w-1),height:h-1,fill:"var(--ng)","fill-opacity":.10,stroke:"var(--ng)","stroke-dasharray":"3 2",rx:1},svg);
          node.__it = it; continue;
        }
        if (it.k === "move"){ fill = it.id % 2 ? "var(--arm)" : "var(--arm2)"; }
        else if (it.k === "suck"){ fill = "var(--suck)"; h = (LANE_H-14)/2; }
        else if (it.k === "blow"){ fill = "var(--blow)"; y = top + LANE_H/2; h = (LANE_H-14)/2; }
        else if (it.k === "vib"){ fill = "var(--feed)"; h = 9; }
        else if (it.k === "brake"){ fill = "var(--brake)"; y = top + 17; h = 9; }
        else if (it.k === "flight"){ fill = "var(--flight)"; y = top + 27; h = 9; }
        else if (it.k === "shot"){ fill = "var(--cam)"; }
        else if (it.k === "light"){ fill = "var(--light)"; y = top + 10; h = LANE_H - 20; }
        else if (it.k === "reel"){ fill = "var(--reel)"; }
        node = el("rect",{x:x0,y,width:it.k==="shot"?Math.max(2.5,w):w,height:h,fill,rx:1},svg);
      }
      node.__it = it;
    }
  });
  $("zoomval").textContent = `${Math.round(pxPerMs*1000)} px/s`;
}

function setZoom(z, anchorT){
  const keepT = anchorT ?? ((scroller.scrollLeft + scroller.clientWidth/2 - PAD) / pxPerMs);
  pxPerMs = Math.min(MAX, Math.max(MIN(), z));
  render();
  scroller.scrollLeft = PAD + keepT*pxPerMs - scroller.clientWidth/2;
  $("zoom").value = zoomToSlider(pxPerMs);
}
$("fit").onclick = () => setZoom(MIN(), S.span/2);
$("zin").onclick = () => setZoom(pxPerMs*1.6);
$("zout").onclick = () => setZoom(pxPerMs/1.6);
$("zoom").oninput = e => setZoom(sliderToZoom(+e.target.value));

svg.addEventListener("mousemove", e => {
  const it = e.target.__it;
  if (!it){ tip.hidden = true; return; }
  const dur = it.e > it.s ? ` · <b>${it.e - it.s} ms</b>` : "";
  let extra = it.k === "move" ? ` #${it.id}` : "";
  if (it.why) extra += `<br>${it.why}`;
  tip.innerHTML = `${NAMES[it.k] || it.k}${extra}<br><b>${(it.s/1000).toFixed(3)} s</b>${dur}`;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 14 + r.height > window.innerHeight ? e.clientY - r.height - 10 : e.clientY + 14) + "px";
});
svg.addEventListener("mouseleave", () => tip.hidden = true);

// drag to pan
let drag = null;
scroller.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; drag = {x:e.clientX, s:scroller.scrollLeft}; scroller.classList.add("drag"); });
window.addEventListener("pointermove", e => { if (drag) scroller.scrollLeft = drag.s - (e.clientX - drag.x); });
window.addEventListener("pointerup", () => { drag = null; scroller.classList.remove("drag"); });

// table
const fmt = v => v == null ? "" : Math.round(v);
$("rows").innerHTML = D.rows.map(r => `<tr data-t="${r.t}">
  <td class="num">${r.n}</td><td class="num">${(r.t/1000).toFixed(2)}</td>
  <td><span class="pill ${r.k}">${r.k === "place" ? "放料" : "丟料"}</span></td>
  <td>${r.why || ""}</td>
  <td class="num">${fmt(r.gap)}</td><td class="num">${fmt(r.reel)}</td><td class="num">${fmt(r.shot2)}</td>
  <td class="num ${r.topres > 700 ? "slow" : ""}">${fmt(r.topres)}</td></tr>`).join("");
$("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const t = +tr.dataset.t;
  if (pxPerMs < 0.25) setZoom(0.25, t); else scroller.scrollLeft = PAD + t*pxPerMs - scroller.clientWidth/2;
  scroller.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});

window.addEventListener("resize", () => { if (pxPerMs < MIN()) setZoom(MIN()); });
setZoom(Math.max(MIN(), 0.08), 5000);
</script>
