<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490"
     role="img" aria-label="Material flow through the PackerX taping machine: a bowl feeder vibrates loose parts into a bulk tray, a delta robot picks from the tray, vision inspects, good parts go into carrier tape pockets and bad parts into NG bins, and the reel motor advances and winds the tape.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Standalone .svg files are rendered inside an <img>, where
       currentColor falls back to black. An explicit light ground keeps
       the figure legible on a dark README as well as a light one. -->
  <rect width="900" height="490" fill="#ffffff"/>

  <g fill="none" stroke="#24292f" stroke-width="1.6">

    <!-- ============ delta robot ============ -->
    <circle cx="470" cy="86" r="46"/>
    <line x1="436" y1="118" x2="452" y2="222"/>
    <line x1="504" y1="118" x2="488" y2="222"/>
    <line x1="470" y1="132" x2="470" y2="222"/>
    <rect x="446" y="222" width="48" height="16" rx="2"/>
    <line x1="470" y1="238" x2="470" y2="262"/>
    <path d="M 462 262 L 478 262 L 470 274 z" fill="#24292f" stroke="none"/>

    <!-- reach envelope -->
    <path d="M 300 300 Q 470 210 700 300" stroke="#57606a"
          stroke-width="1.1" stroke-dasharray="5 5"/>

    <!-- ============ bowl feeder ============ -->
    <rect x="30" y="212" width="126" height="62" rx="3"/>

    <!-- ============ bulk tray ============ -->
    <rect x="200" y="306" width="200" height="58" rx="3"/>
    <g fill="#24292f" stroke="none">
      <circle cx="232" cy="330" r="3"/><circle cx="262" cy="344" r="3"/>
      <circle cx="292" cy="326" r="3"/><circle cx="322" cy="348" r="3"/>
      <circle cx="352" cy="332" r="3"/><circle cx="378" cy="345" r="3"/>
      <circle cx="248" cy="352" r="3"/><circle cx="336" cy="322" r="3"/>
    </g>

    <!-- ============ down camera ============ -->
    <rect x="576" y="150" width="96" height="40" rx="3"/>
    <line x1="624" y1="190" x2="560" y2="296" stroke="#57606a"
          stroke-width="1.1" stroke-dasharray="4 4"/>

    <!-- ============ NG bins ============ -->
    <rect x="596" y="306" width="112" height="46" rx="3"/>
    <line x1="633" y1="306" x2="633" y2="352"/>
    <line x1="670" y1="306" x2="670" y2="352"/>

    <!-- ============ carrier tape line ============ -->
    <line x1="150" y1="404" x2="770" y2="404"/>
    <line x1="150" y1="438" x2="770" y2="438"/>
    <g>
      <rect x="196" y="412" width="20" height="18"/>
      <rect x="252" y="412" width="20" height="18"/>
      <rect x="308" y="412" width="20" height="18"/>
      <rect x="364" y="412" width="20" height="18"/>
      <rect x="420" y="412" width="20" height="18"/>
      <rect x="476" y="412" width="20" height="18"/>
      <rect x="532" y="412" width="20" height="18"/>
    </g>

    <!-- ============ reel ============ -->
    <circle cx="812" cy="421" r="30"/>
    <circle cx="812" cy="421" r="9"/>
  </g>

  <!-- ============ flow arrows (the part's path) ============ -->
  <g fill="none" stroke="#bc4c00" stroke-width="2.2" marker-end="url(#a)">
    <path d="M 156 250 Q 200 250 226 300"/>
    <path d="M 330 306 Q 400 256 462 250"/>
    <path d="M 478 280 Q 500 350 500 404"/>
    <path d="M 500 262 Q 580 268 630 300"/>
    <line x1="560" y1="421" x2="774" y2="421"/>
  </g>

  <!-- ============ labels ============ -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif"
     font-size="12.5" fill="#24292f">

    <text x="93" y="240" text-anchor="middle" font-weight="600">Bowl feeder</text>
    <text x="93" y="256" text-anchor="middle" fill="#57606a">SmartBowlFeeder</text>
    <text x="93" y="292" text-anchor="middle" fill="#57606a">Modbus RTU addr 1</text>

    <text x="300" y="290" text-anchor="middle" font-weight="600">Bulk tray</text>
    <text x="300" y="382" text-anchor="middle" fill="#57606a">loose parts, no fixed pose</text>

    <text x="470" y="62" text-anchor="middle" font-weight="600">Delta robot</text>
    <text x="470" y="90" text-anchor="middle" fill="#57606a">EAxis0/1/2</text>
    <text x="470" y="106" text-anchor="middle" fill="#57606a">arm1 arm2 arm3</text>
    <text x="512" y="232" fill="#57606a">vacuum nozzle</text>

    <text x="624" y="142" text-anchor="middle" font-weight="600">Vision</text>
    <text x="624" y="175" text-anchor="middle" fill="#57606a">HIKROBOT</text>

    <text x="652" y="296" text-anchor="middle" font-weight="600">NG bins</text>

    <text x="180" y="396" font-weight="600">Carrier tape</text>
    <text x="180" y="464" fill="#57606a">ConveyorEncoderAxis tracks belt position</text>

    <text x="812" y="382" text-anchor="middle" font-weight="600">Reel</text>
    <text x="812" y="470" text-anchor="middle" fill="#57606a">reelpullmotor</text>

    <!-- arrow labels -->
    <g fill="#bc4c00" font-size="11.5">
      <text x="186" y="284">feeds</text>
      <text x="396" y="266" text-anchor="middle">pick</text>
      <text x="508" y="352">place in pocket</text>
      <text x="566" y="264">reject</text>
      <text x="664" y="412" text-anchor="middle">advance + wind</text>
    </g>

    <text x="470" y="206" text-anchor="middle" fill="#57606a" font-size="11.5">
      reach envelope
    </text>
  </g>
</svg>
